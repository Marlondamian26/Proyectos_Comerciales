name: Visual Regression & Accessibility Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  NODE_VERSION: "20"
  PLAYWRIGHT_BROWSERS_PATH: 0

jobs:
  visual-tests:
    name: Visual Regression & A11y Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build application
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Start application server
        run: |
          npm run start &
          sleep 10
          curl -f http://localhost:3000 || exit 1

      - name: Run comprehensive visual regression tests
        run: npm run test:visual:comprehensive
        env:
          PLAYWRIGHT_BROWSERS_PATH: 0

      - name: Run accessibility tests
        run: npm run test:a11y
        env:
          PLAYWRIGHT_BROWSERS_PATH: 0

      - name: Upload visual test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-test-reports
          path: |
            playwright-report-visual/
            test-results/
            visual-tests/snapshots/
            visual-tests/diffs/
          retention-days: 30

      - name: Upload accessibility reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accessibility-reports
          path: |
            playwright-report-a11y/
            test-results/a11y-results.json
          retention-days: 30

  lighthouse-ci:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build application
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Run Lighthouse CI
        run: npm run test:lighthouse
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: |
            .lighthouseci/
          retention-days: 30

  storybook-tests:
    name: Storybook Component Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build Storybook
        run: npm run storybook:build

      - name: Start Storybook static server
        run: |
          npx http-server storybook-static -p 6006 &
          sleep 5
          curl -f http://localhost:6006 || exit 1

      - name: Run Storybook visual tests
        run: npx playwright test visual-tests/components.visual.test.ts -c playwright.visual.config.ts
        env:
          PLAYWRIGHT_BROWSERS_PATH: 0

      - name: Upload Storybook reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: storybook-reports
          path: |
            playwright-report/
            storybook-static/
          retention-days: 30

  summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [visual-tests, lighthouse-ci, storybook-tests]
    if: always()
    steps:
      - name: Check test results
        run: |
          echo "## Test Results Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Visual Regression & A11y | ${{ needs.visual-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Lighthouse CI | ${{ needs.lighthouse-ci.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Storybook Tests | ${{ needs.storybook-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "- Visual test reports: \`visual-test-reports\`" >> $GITHUB_STEP_SUMMARY
          echo "- Accessibility reports: \`accessibility-reports\`" >> $GITHUB_STEP_SUMMARY
          echo "- Lighthouse reports: \`lighthouse-reports\`" >> $GITHUB_STEP_SUMMARY
          echo "- Storybook reports: \`storybook-reports\`" >> $GITHUB_STEP_SUMMARY

      - name: Fail if any job failed
        if: ${{ needs.visual-tests.result != 'success' || needs.lighthouse-ci.result != 'success' || needs.storybook-tests.result != 'success' }}
        run: exit 1